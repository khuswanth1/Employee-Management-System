# Alembic configuration for WorkSphere Platform Database
[alembic]
script_location = alembic_platform
prepend_sys_path = .
version_path_separator = os

# Default platform database URL
sqlalchemy.url = postgresql+psycopg://postgres:2205@localhost:5432/empolyee-management

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
