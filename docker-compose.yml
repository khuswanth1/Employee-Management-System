# Local development: Postgres + FastAPI (reload) + Vite (HMR).
#   cp .env.example .env   # fill in the blanks
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?set PLATFORM_DB_PASSWORD in .env}
      PROVISIONER_DB_PASSWORD: ${PROVISIONER_DB_PASSWORD:?set PROVISIONER_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
    ports: ["127.0.0.1:5432:5432"]

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      ENVIRONMENT: development
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      PLATFORM_DATABASE_URL: postgresql+psycopg://worksphere_platform:${PLATFORM_DB_PASSWORD}@db:5432/worksphere_platform
      TENANT_DB_MODE: postgres
      POSTGRES_ADMIN_URL: postgresql+psycopg://worksphere_provisioner:${PROVISIONER_DB_PASSWORD}@db:5432/postgres
      TENANT_DB_HOST: db
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:5173}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      UPLOAD_DIR: /app/data/uploads
      BACKUP_DIR: /app/data/backups
      TURN_URL: ${TURN_URL:-}
      TURN_SECRET: ${TURN_SECRET:-}
    volumes:
      - ./backend/app:/app/app
      - appdata:/app/data
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:8000:8000"]

  frontend:
    build: { context: ./frontend, target: dev }
    environment:
      VITE_API_PROXY: http://backend:8000
    volumes:
      - ./frontend/src:/app/src
    depends_on: [backend]
    ports: ["127.0.0.1:5173:5173"]

  # WebRTC relay for users behind strict NATs. Backend issues short-lived credentials from TURN_SECRET.
  # Opt-in: docker compose --profile turn up -d. Requires TURN_SECRET, TURN_EXTERNAL_IP (public IP) and TURN_URL=turn:<host>:3478 in .env.
  # Open UDP/TCP 3478 and UDP 49160-49200 in the firewall.
  coturn:
    image: coturn/coturn:4.6
    profiles: [turn]
    restart: unless-stopped
    command:
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-}
      - --realm=${TURN_REALM:-worksphere}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      - --fingerprint
      - --no-cli
      - --no-multicast-peers
      # never relay into private networks (SSRF / lateral movement)
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"

volumes:
  pgdata:
  appdata:
