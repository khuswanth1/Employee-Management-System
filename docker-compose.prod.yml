# Production-style stack: Nginx (TLS) -> static frontend + FastAPI -> Postgres. See README "Deployment".
#   docker compose -f docker-compose.prod.yml up -d --build
# Place certificate files in ./nginx/certs/fullchain.pem and privkey.pem (e.g. from Let's Encrypt).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?}
      PROVISIONER_DB_PASSWORD: ${PROVISIONER_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 10
    networks: [internal]

  # Shared by all backend instances: rate limits, live-event fan-out, job lock. Private network only, password required.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
      PLATFORM_DATABASE_URL: postgresql+psycopg://worksphere_platform:${PLATFORM_DB_PASSWORD}@db:5432/worksphere_platform
      TENANT_DB_MODE: postgres
      POSTGRES_ADMIN_URL: postgresql+psycopg://worksphere_provisioner:${PROVISIONER_DB_PASSWORD}@db:5432/postgres
      TENANT_DB_HOST: db
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?}
      APP_BASE_URL: ${PUBLIC_ORIGIN:?}
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      UPLOAD_DIR: /app/data/uploads
      BACKUP_DIR: /app/data/backups
      TURN_URL: ${TURN_URL:-}
      TURN_SECRET: ${TURN_SECRET:-}
    volumes:
      - appdata:/app/data
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal]

  frontend:
    build: { context: ./frontend, target: prod }
    restart: unless-stopped
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on: [backend, frontend]
    networks: [internal]

  # WebRTC relay for users behind strict NATs. Backend issues short-lived credentials from TURN_SECRET.
  # Opt-in: docker compose --profile turn up -d. Requires TURN_SECRET, TURN_EXTERNAL_IP (public IP) and TURN_URL=turn:<host>:3478 in .env.
  # Open UDP/TCP 3478 and UDP 49160-49200 in the firewall.
  coturn:
    image: coturn/coturn:4.6
    profiles: [turn]
    restart: unless-stopped
    command:
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-}
      - --realm=${TURN_REALM:-worksphere}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      - --fingerprint
      - --no-cli
      - --no-multicast-peers
      # never relay into private networks (SSRF / lateral movement)
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"

networks:
  internal:

volumes:
  pgdata:
  appdata:
